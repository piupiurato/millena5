  /* Degradé para o texto ler-se bem sem esconder os rostos */

    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(to top, rgba(10,3,5,.88) 0%, rgba(10,3,5,.55) 32%, rgba(10,3,5,0) 60%),
      linear-gradient(to bottom, rgba(10,3,5,.35) 0%, rgba(10,3,5,0) 25%);

  .palco{
    position:fixed;inset:0;z-index:2;
    display:flex;align-items:flex-end;justify-content:center;
    padding:24px 22px calc(40px + env(safe-area-inset-bottom,0px));

  }
  .conteudo{width:100%;max-width:720px}

  /* Botão inicial */
  #inicio{
    appearance:none;border:1px solid rgba(255,155,179,.6);
    background:rgba(20,6,10,.45);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:var(--texto);
    font:italic 400 clamp(1rem,3.6vw,1.35rem)/1.5 'Playfair Display',Georgia,serif;
    padding:18px 26px;border-radius:18px;cursor:pointer;
    max-width:100%;
    box-shadow:0 0 28px rgba(255,100,140,.35);
    animation:pulsa 2.6s ease-in-out infinite;
    transition:opacity .8s ease, transform .8s ease;
  }
  #inicio:active{transform:scale(.98)}
  @keyframes pulsa{50%{box-shadow:0 0 44px rgba(255,100,140,.65)}}
  #inicio.some{opacity:0;transform:translateY(10px);pointer-events:none;animation:none}

  /* Declarações */
  #declaracao{
    font-family:'Great Vibes','Playfair Display',cursive;
    font-size:clamp(1.9rem,6.6vw,3.2rem);
    line-height:1.3;
    text-shadow:0 2px 18px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);
    transition:opacity 1.2s ease, transform 1.2s ease;
    min-height:4.2em;display:flex;align-items:flex-end;justify-content:center;
  }
  #declaracao.visivel{opacity:1;transform:none}
  #declaracao span{display:block}


  #repetir{
    display:none;margin:18px auto 0;
    appearance:none;border:1px solid rgba(255,155,179,.6);background:transparent;
    color:var(--texto);font:italic 1rem 'Playfair Display',serif;
    padding:10px 22px;border-radius:999px;cursor:pointer;
  }
  #repetir.visivel{display:inline-block}

  /* Corações a subir */
  .coracao{
    position:fixed;bottom:-30px;z-index:1;pointer-events:none;
    color:var(--rosa);opacity:0;
    animation:sobe linear forwards;
  }
  @keyframes sobe{
    0%{opacity:0;transform:translateY(0) scale(.6)}
    15%{opacity:.8}
    100%{opacity:0;transform:translateY(-105vh) scale(1.2)}
  }

  /* Botões de música e voz */
  #controlos{
    position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;
    display:none;gap:10px;
  }
  #controlos.visivel{display:flex}
  #controlos button{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.35);background:rgba(20,6,10,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:#fff;font-size:18px;cursor:pointer;
  }
  #controlos button.off{opacity:.45}

  @media (prefers-reduced-motion:reduce){
    .fundo,#inicio{animation:none}
  }

<body>

<div class="fundo" role="img" aria-label="Nós os dois, abraçados"></div>
<div class="veu"></div>

<div id="controlos">
  <button id="voz" aria-label="Ligar ou desligar a voz">🗣️</button>
  <button id="som" aria-label="Ligar ou desligar a música">🔊</button>
</div>

<main class="palco">
  <div class="conteudo">
    <button id="inicio">a minha declaração, nem a distância que nos separa me impede de fazê-la...</button>
    <div id="declaracao" aria-live="polite"><span></span></div>
    <button id="repetir">ler de novo ♥</button>
  </div>
</main>

<audio id="musica" loop preload="auto" playsinline></audio>

<script>
/* ============ PERSONALIZA AQUI ============ */

// Ficheiro da música (põe o .mp3 na mesma pasta do index.html)
const MUSICA = "musica.mp3";

// Segundos que cada declaração fica no ecrã (avançam sozinhas)
const SEGUNDOS_POR_DECLARACAO = 7;

// Voz que lê as declarações (true = ligada ao começar)
const VOZ_ATIVA = true;
// Velocidade (1 = normal) e tom (1 = normal; mais alto = mais agudo) da voz
const VOZ_VELOCIDADE = 0.92;
const VOZ_TOM = 1.1;
// Volume da música enquanto a voz fala (0 a 1) e quando está só a música
const VOLUME_MUSICA_COM_VOZ = 0.22;
const VOLUME_MUSICA = 0.8;

// Declarações em português do Brasil (uma de cada vez). Podes editar, apagar ou acrescentar à vontade.
const DECLARACOES = [
  "Te amo, Millena. E hoje quero que o mundo inteiro saiba.",
  "Há quilômetros entre nós, mas não existe distância entre o meu coração e o seu.",
  "Cada mensagem sua é o melhor momento do meu dia.",
  "Fechei os olhos e vi você. Foi assim que percebi que já mora em mim.",
  "Se o amor tivesse um endereço, seria o seu sorriso.",
  "Espero todo dia por uma palavra sua, como quem espera o sol nascer.",
  "Um dia a distância vai acabar, e eu vou te abraçar como se fosse a primeira vez.",
  "Até lá, levo você comigo em cada pensamento.",
  "Você é a minha saudade favorita e a minha certeza mais bonita.",
  "Te amo hoje, te amo amanhã, te amo para sempre. ♥"
];
/* =========================================== */

const botao = document.getElementById('inicio');
const caixa = document.getElementById('declaracao');
const texto = caixa.querySelector('span');
const repetir = document.getElementById('repetir');
const musica = document.getElementById('musica');
const som = document.getElementById('som');
const voz = document.getElementById('voz');
const controlos = document.getElementById('controlos');

let indice = -1, temporizador = null, ocupado = false, comecou = false, acabou = false;
let vozLigada = VOZ_ATIVA;
const temVoz = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

/* ---------- Música ---------- */
function iniciarMusica(){
  musica.src = MUSICA;
  musica.volume = VOLUME_MUSICA;
  const p = musica.play();
  if (p && p.catch) p.catch(()=>{ /* sem ficheiro ou bloqueado: o site continua a funcionar */ });
  controlos.classList.add('visivel');
}

som.addEventListener('click', e=>{
  e.stopPropagation();
  if (musica.paused){ musica.play().catch(()=>{}); som.textContent='🔊'; }
  else { musica.pause(); som.textContent='🔇'; }
});

function volumeMusica(v){ try{ musica.volume = v; }catch(e){} }

/* ---------- Voz feminina (pt-BR) ---------- */
let vozEscolhida = null;
const PREFERIDAS = ['luciana','francisca','vitória','vitoria','camila','fernanda','maria','thalita','google português do brasil','google portuguese'];
const MASCULINAS = ['daniel','felipe','antonio','antônio','ricardo','jorge','paulo','male'];

function escolherVoz(){
  if (!temVoz) return;
  const todas = speechSynthesis.getVoices();
  let br = todas.filter(v => /pt[-_]BR/i.test(v.lang));
  if (!br.length) br = todas.filter(v => /^pt/i.test(v.lang));
  const nome = v => v.name.toLowerCase();
  vozEscolhida =
    br.find(v => PREFERIDAS.some(p => nome(v).includes(p)) && !MASCULINAS.some(m => nome(v).includes(m))) ||
    br.find(v => !MASCULINAS.some(m => nome(v).includes(m))) ||
    br[0] || null;
}
if (temVoz){
  escolherVoz();
  speechSynthesis.onvoiceschanged = escolherVoz;
}

function limparParaFala(s){
  return s.replace(/[♥❤]/g,'').replace(/\s+/g,' ').trim();
}

// Lê a frase e chama aoFim() quando acaba (ou se a voz falhar / estiver desligada)
function falar(frase, aoFim){
  let feito = false;
  const fim = ()=>{
    if (feito) return; feito = true;
    clearTimeout(salvaguarda);
    volumeMusica(VOLUME_MUSICA);
    aoFim();
  };
  const estimativa = Math.max(SEGUNDOS_POR_DECLARACAO*1000, frase.length*110 + 3000);
  let salvaguarda;

  if (!vozLigada || !temVoz){
    salvaguarda = setTimeout(fim, SEGUNDOS_POR_DECLARACAO*1000);
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(limparParaFala(frase));
    u.lang = 'pt-BR';
    if (vozEscolhida) u.voice = vozEscolhida;
    u.rate = VOZ_VELOCIDADE;
    u.pitch = VOZ_TOM;
    u.onstart = ()=> volumeMusica(VOLUME_MUSICA_COM_VOZ);
    u.onend = ()=> setTimeout(fim, 1800);   // pequena pausa depois de falar
    u.onerror = ()=> fim();
    salvaguarda = setTimeout(fim, estimativa + 6000); // caso o navegador não avise que acabou
    speechSynthesis.speak(u);
  }catch(e){
    salvaguarda = setTimeout(fim, SEGUNDOS_POR_DECLARACAO*1000);
  }
}

voz.addEventListener('click', e=>{
  e.stopPropagation();
  vozLigada = !vozLigada;
  voz.classList.toggle('off', !vozLigada);
  if (!vozLigada && temVoz){ speechSynthesis.cancel(); volumeMusica(VOLUME_MUSICA); }
});

/* ---------- Declarações ---------- */
function mostrar(frase, aoTerminar){
  ocupado = true;
  caixa.classList.remove('visivel');
  setTimeout(()=>{
    texto.textContent = frase;
    caixa.classList.add('visivel');
    corações(6);
    ocupado = false;
    if (aoTerminar) aoTerminar();
  }, 1000);
}

function proxima(){
  if (ocupado || acabou) return;
  clearTimeout(temporizador);
  indice++;
  if (indice >= DECLARACOES.length){
    acabou = true;
    repetir.classList.add('visivel');
    return;
  }
  const frase = DECLARACOES[indice];
  mostrar(frase, ()=>{
    falar(frase, ()=>{
      if (indice < DECLARACOES.length - 1){
        proxima();
      } else {
        acabou = true;
        setTimeout(()=>repetir.classList.add('visivel'), 800);
      }
    });
  });
}

botao.addEventListener('click', ()=>{
  if (comecou) return;
  comecou = true;
  iniciarMusica();            // a música começa logo neste clique
  voz.classList.toggle('off', !vozLigada);
  if (temVoz){                // "desbloqueia" a voz dentro do clique (iPhone/Android)
    try{ const w = new SpeechSynthesisUtterance(' '); w.volume = 0; speechSynthesis.speak(w); }catch(e){}
  }
  botao.classList.add('some');
  setTimeout(()=>{ botao.style.display='none'; proxima(); }, 900);
});

repetir.addEventListener('click', e=>{
  e.stopPropagation();
  repetir.classList.remove('visivel');
  if (temVoz) speechSynthesis.cancel();
  indice = -1; acabou = false;
  proxima();
});

function corações(n){
  for (let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'coracao';
    c.textContent = '♥';
    c.style.left = Math.random()*100 + 'vw';
    c.style.fontSize = (14 + Math.random()*22) + 'px';
    c.style.animationDuration = (6 + Math.random()*5) + 's';
    c.style.animationDelay = (Math.random()*1.5) + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 13000);
  }
}
</script>
